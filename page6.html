<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생일초대장 - 6</title>
<style>
  /* ====== 여기부터 디자인 커스텀 영역 (자유롭게 수정하세요) ====== */
  :root {
    --bg-color: #fff;
    --font-family: sans-serif;
    --text-color: #222;
    --bg-image: url('images/6.png');
  }
  /* ====== 여기까지 ====== */

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    position: relative;
    min-height: 100vh;
    background-color: var(--bg-color);
    background-image: var(--bg-image);
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    font-family: var(--font-family);
    color: var(--text-color);
  }

  .start-btn {
    position: absolute;
    left: 29.9%;
    top: 63.6%;
    width: 39.7%;
    height: 7.9%;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
  }
</style>
</head>
<body>
  <button class="start-btn" id="startBtn" aria-label="시작하기"></button>

  <audio id="bgMusic" src="mp3/선물게임.mp3" loop></audio>

  <script>
    const startBtn = document.getElementById('startBtn');
    const bgMusic = document.getElementById('bgMusic');

    const bgTrack = bgMusic.getAttribute('src');

    (function resumeBgMusic() {
      const savedTrack = sessionStorage.getItem('bgMusicTrack');
      const savedTime = parseFloat(sessionStorage.getItem('bgMusicTime') || '0');
      const savedTimestamp = parseFloat(sessionStorage.getItem('bgMusicTimestamp') || '0');
      if (savedTrack !== bgTrack || !savedTimestamp) return;

      const applyTime = () => {
        let t = savedTime + (Date.now() - savedTimestamp) / 1000;
        if (bgMusic.duration && isFinite(bgMusic.duration)) {
          t = t % bgMusic.duration;
        }
        bgMusic.currentTime = t;
      };
      if (bgMusic.readyState >= 1) {
        applyTime();
      } else {
        bgMusic.addEventListener('loadedmetadata', applyTime, { once: true });
      }
    })();

    function tryPlayBgMusic() {
      bgMusic.play().catch(() => {});
    }
    tryPlayBgMusic();
    document.addEventListener('click', tryPlayBgMusic, { once: true });
    document.addEventListener('touchstart', tryPlayBgMusic, { once: true });

    window.addEventListener('pagehide', () => {
      sessionStorage.setItem('bgMusicTrack', bgTrack);
      sessionStorage.setItem('bgMusicTime', bgMusic.currentTime);
      sessionStorage.setItem('bgMusicTimestamp', Date.now());
    });

    document.querySelectorAll('button').forEach((btn) => {
      btn.addEventListener('click', () => {
        new Audio('mp3/버튼.mp3').play().catch(() => {});
      });
    });

    startBtn.addEventListener('click', () => {
      if (startBtn.disabled) return;
      startBtn.disabled = true;
      setTimeout(() => {
        window.location.href = 'page7.html';
      }, 150);
    });
  </script>
</body>
</html>
