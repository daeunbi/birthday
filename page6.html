<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생일초대장 - 6</title>
<style>
  /* ====== 여기부터 디자인 커스텀 영역 (자유롭게 수정하세요) ====== */
  :root {
    --bg-color: #fff;
    --font-family: sans-serif;
    --text-color: #222;
    --bg-image: url('images/6.png');
  }
  /* ====== 여기까지 ====== */

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    position: relative;
    min-height: 100vh;
    overflow: hidden;
    background-color: var(--bg-color);
    background-image: var(--bg-image);
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    font-family: var(--font-family);
    color: var(--text-color);
  }

  .shell-wrap {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transition: opacity 0.5s ease;
  }
  .shell-wrap.finished {
    opacity: 0;
    pointer-events: none;
  }

  .shell-hint {
    position: absolute;
    top: 42%;
    left: 50%;
    transform: translateX(-50%);
    margin: 0;
    font-size: 15px;
    font-weight: bold;
    text-align: center;
    color: #333;
    white-space: nowrap;
  }

  .shell-game {
    position: absolute;
    top: 60%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    max-width: 380px;
    height: 110px;
  }

  .cup {
    position: absolute;
    top: 50%;
    width: 90px;
    height: 90px;
    transform: translate(-50%, -50%);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    transition: left 0.14s ease-in-out;
  }
  .cup:disabled {
    cursor: default;
  }
  .cup .cup-box,
  .cup .cup-result {
    display: block;
    font-size: 64px;
    line-height: 1;
    transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .cup .cup-result {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    opacity: 0;
    transform: scale(0.3);
  }
  .cup.opened .cup-box {
    opacity: 0;
    transform: scale(0.6) translateY(-10px);
  }
  .cup.opened .cup-result {
    opacity: 1;
    transform: scale(1);
  }
  .cup.wrong {
    opacity: 0.4;
  }

  .spark {
    position: absolute;
    top: 60%;
    left: 50%;
    font-size: 28px;
    opacity: 1;
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: transform 0.6s ease-out, opacity 0.6s ease-out;
  }
  .spark.fly {
    opacity: 0;
  }

  .gift-popup {
    position: absolute;
    top: 48%;
    left: 50%;
    width: 94%;
    max-width: 420px;
    height: auto;
    transform: translate(-50%, -50%) scale(0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .gift-popup.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .next-btn {
    position: absolute;
    left: 78.8%;
    top: 81.8%;
    transform: translate(-50%, -50%) scale(0.7);
    background: none;
    border: none;
    font-size: 16px;
    font-weight: bold;
    color: #333;
    cursor: pointer;
    padding: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .next-btn.show {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
  }
</style>
</head>
<body>
  <div class="shell-wrap" id="shellWrap">
    <p class="shell-hint" id="shellHint"></p>
    <div class="shell-game" id="shellGame">
      <button class="cup" id="cup0" disabled>
        <span class="cup-box">📦</span>
        <span class="cup-result"></span>
      </button>
      <button class="cup" id="cup1" disabled>
        <span class="cup-box">📦</span>
        <span class="cup-result"></span>
      </button>
      <button class="cup" id="cup2" disabled>
        <span class="cup-box">📦</span>
        <span class="cup-result"></span>
      </button>
    </div>
  </div>

  <img class="gift-popup" id="giftPopup" src="images/선물팝업.png" alt="">
  <button class="next-btn" id="nextBtn">다음으로</button>

  <audio id="bgMusic" src="mp3/룰렛.mp3" loop></audio>

  <script>
    const shellWrap = document.getElementById('shellWrap');
    const shellHint = document.getElementById('shellHint');
    const cups = [0, 1, 2].map((i) => document.getElementById('cup' + i));
    const giftPopup = document.getElementById('giftPopup');
    const nextBtn = document.getElementById('nextBtn');
    const bgMusic = document.getElementById('bgMusic');

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const boostedCtx = AudioCtx ? new AudioCtx() : null;
    const boostedBuffers = {};

    function preloadBoosted(src) {
      if (!boostedCtx) return;
      fetch(src)
        .then((res) => res.arrayBuffer())
        .then((data) => boostedCtx.decodeAudioData(data))
        .then((buffer) => { boostedBuffers[src] = buffer; })
        .catch(() => {});
    }
    preloadBoosted('mp3/꽝.mp3');

    function playBoosted(src, gain) {
      const buffer = boostedBuffers[src];
      if (!boostedCtx || !buffer) {
        new Audio(src).play().catch(() => {});
        return;
      }
      if (boostedCtx.state === 'suspended') boostedCtx.resume();
      const source = boostedCtx.createBufferSource();
      source.buffer = buffer;
      const gainNode = boostedCtx.createGain();
      gainNode.gain.value = gain;
      source.connect(gainNode).connect(boostedCtx.destination);
      source.start(0);
    }

    const bgTrack = bgMusic.getAttribute('src');

    (function resumeBgMusic() {
      const savedTrack = sessionStorage.getItem('bgMusicTrack');
      const savedTime = parseFloat(sessionStorage.getItem('bgMusicTime') || '0');
      const savedTimestamp = parseFloat(sessionStorage.getItem('bgMusicTimestamp') || '0');
      if (savedTrack !== bgTrack || !savedTimestamp) return;

      const applyTime = () => {
        let t = savedTime + (Date.now() - savedTimestamp) / 1000;
        if (bgMusic.duration && isFinite(bgMusic.duration)) {
          t = t % bgMusic.duration;
        }
        bgMusic.currentTime = t;
      };
      if (bgMusic.readyState >= 1) {
        applyTime();
      } else {
        bgMusic.addEventListener('loadedmetadata', applyTime, { once: true });
      }
    })();

    function tryPlayBgMusic() {
      bgMusic.play().catch(() => {});
    }
    tryPlayBgMusic();
    document.addEventListener('click', tryPlayBgMusic, { once: true });
    document.addEventListener('touchstart', tryPlayBgMusic, { once: true });

    window.addEventListener('pagehide', () => {
      sessionStorage.setItem('bgMusicTrack', bgTrack);
      sessionStorage.setItem('bgMusicTime', bgMusic.currentTime);
      sessionStorage.setItem('bgMusicTimestamp', Date.now());
    });

    document.querySelectorAll('button').forEach((btn) => {
      btn.addEventListener('click', () => {
        new Audio('mp3/버튼.mp3').play().catch(() => {});
      });
    });

    nextBtn.addEventListener('click', () => {
      setTimeout(() => {
        window.location.href = 'page7.html';
      }, 150);
    });

    const POSITIONS = [18, 50, 82];
    let slots = [0, 1, 2];

    function layoutCups() {
      cups.forEach((cup, i) => {
        cup.style.left = POSITIONS[slots[i]] + '%';
      });
    }
    layoutCups();

    const giftCupIndex = Math.floor(Math.random() * 3);
    let shuffling = true;
    let gameOver = false;

    function swapRandomPair() {
      const a = Math.floor(Math.random() * 3);
      let b = Math.floor(Math.random() * 3);
      while (b === a) b = Math.floor(Math.random() * 3);
      const tmp = slots[a];
      slots[a] = slots[b];
      slots[b] = tmp;
      layoutCups();
    }

    const TOTAL_SHUFFLES = 16;
    const SHUFFLE_INTERVAL = 140;
    let shuffleStep = 0;

    function runShuffle() {
      swapRandomPair();
      shuffleStep++;
      if (shuffleStep < TOTAL_SHUFFLES) {
        setTimeout(runShuffle, SHUFFLE_INTERVAL);
      } else {
        shuffling = false;
        cups.forEach((cup) => { cup.disabled = false; });
        shellHint.textContent = '선물이 든 상자를 골라보세요!';
      }
    }
    setTimeout(runShuffle, 700);

    function spawnSpark() {
      const spark = document.createElement('span');
      spark.className = 'spark';
      spark.textContent = ['✨', '🎉', '⭐'][Math.floor(Math.random() * 3)];
      document.body.appendChild(spark);

      const angle = Math.random() * Math.PI * 2;
      const distance = 90 + Math.random() * 60;
      const dx = Math.cos(angle) * distance;
      const dy = Math.sin(angle) * distance;

      requestAnimationFrame(() => {
        spark.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        spark.classList.add('fly');
      });

      setTimeout(() => spark.remove(), 650);
    }

    cups.forEach((cup, i) => {
      cup.addEventListener('click', () => {
        if (shuffling || gameOver || cup.classList.contains('opened')) return;

        const hasGift = i === giftCupIndex;
        cup.querySelector('.cup-result').textContent = hasGift ? '🎁' : '💨';
        cup.classList.add('opened');

        if (hasGift) {
          gameOver = true;
          cups.forEach((c) => { c.disabled = true; });
          new Audio('mp3/당첨.mp3').play().catch(() => {});
          for (let s = 0; s < 10; s++) spawnSpark();

          setTimeout(() => {
            shellWrap.classList.add('finished');
            giftPopup.classList.add('show');
            nextBtn.classList.add('show');
          }, 1700);
        } else {
          cup.classList.add('wrong');
          cup.disabled = true;
          playBoosted('mp3/꽝.mp3', 2.5);
        }
      });
    });
  </script>
</body>
</html>
