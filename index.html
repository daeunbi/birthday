<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생일초대장</title>
<style>
  /* ====== 여기부터 디자인 커스텀 영역 (자유롭게 수정하세요) ====== */
  :root {
    --bg-color: #fff;
    --font-family: sans-serif;
    --text-color: #222;
    --bg-image: url('images/1.png');
  }
  /* ====== 여기까지 ====== */

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    position: relative;
    background-color: var(--bg-color);
    background-image: var(--bg-image);
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    font-family: var(--font-family);
    color: var(--text-color);
  }

  .cake-btn {
    position: absolute;
    left: 24%;
    top: 63%;
    width: 52%;
    height: 26%;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
  }

  .cake-hint {
    position: absolute;
    top: 90%;
    left: 50%;
    transform: translateX(-50%);
    margin: 0;
    font-size: 17px;
    opacity: 0.7;
    text-align: center;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <button class="cake-btn" id="cakeBtn" aria-label="케이크 누르기"></button>
  <p class="cake-hint">케이크를 눌러주세요.</p>

  <audio id="bgMusic" src="mp3/생일축하.mp3" loop></audio>

  <script>
    const cakeBtn = document.getElementById('cakeBtn');
    const bgMusic = document.getElementById('bgMusic');

    function tryPlayBgMusic() {
      bgMusic.play().catch(() => {});
    }
    tryPlayBgMusic();
    document.addEventListener('click', tryPlayBgMusic, { once: true });
    document.addEventListener('touchstart', tryPlayBgMusic, { once: true });

    document.querySelectorAll('button').forEach((btn) => {
      btn.addEventListener('click', () => {
        new Audio('mp3/버튼.mp3').play().catch(() => {});
      });
    });

    cakeBtn.addEventListener('click', () => {
      if (cakeBtn.disabled) return;
      cakeBtn.disabled = true;
      setTimeout(() => {
        window.location.href = 'page2.html';
      }, 150);
    });
  </script>
</body>
</html>
