<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생일초대장</title>
<style>
  /* ====== 여기부터 디자인 커스텀 영역 (자유롭게 수정하세요) ====== */
  :root {
    --bg-color: #fff;
    --font-family: sans-serif;
    --text-color: #222;
  }
  /* ====== 여기까지 ====== */

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: var(--bg-color);
    font-family: var(--font-family);
    color: var(--text-color);
  }
  h1 {
    font-size: 28px;
  }
  .letter-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 90px;
    line-height: 1;
    padding: 0;
    animation: wiggle 2s ease-in-out infinite;
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-6deg); }
    50% { transform: rotate(6deg); }
  }
  .letter-btn:active {
    animation-play-state: paused;
    transform: scale(0.92);
  }
  .hint {
    font-size: 14px;
    opacity: 0.6;
  }
</style>
</head>
<body>
  <h1>생일초대장 1페이지</h1>
  <img src="images/example.jpg" alt="사진" style="max-width: 80%; display:none;">

  <button class="letter-btn" id="letterBtn" aria-label="편지 열기">
    💌
  </button>
  <p class="hint">편지를 눌러주세요</p>

  <script>
    const letterBtn = document.getElementById('letterBtn');

    letterBtn.addEventListener('click', () => {
      if (letterBtn.disabled) return;
      letterBtn.disabled = true;
      window.location.href = 'page2.html';
    });
  </script>
</body>
</html>
