<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생일초대장 - 2</title>
<style>
  /* ====== 여기부터 디자인 커스텀 영역 (자유롭게 수정하세요) ====== */
  :root {
    --bg-color: #fff;
    --font-family: sans-serif;
    --text-color: #222;
    --bg-image: url('images/2.png');
    --sector-1: #ffd1dc;
    --sector-2: #d1e8ff;
    --sector-3: #d1ffd6;
    --sector-4: #fff3b0;
  }
  /* ====== 여기까지 ====== */

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    position: relative;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    background-color: var(--bg-color);
    background-image: var(--bg-image);
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    font-family: var(--font-family);
    color: var(--text-color);
  }

  .next-btn {
    position: absolute;
    left: 78.8%;
    top: 81.8%;
    transform: translate(-50%, -50%);
    background: none;
    border: none;
    font-size: 16px;
    font-weight: bold;
    color: #333;
    cursor: pointer;
    padding: 0;
  }

  .content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    transform: translateY(-40px);
  }

  .title {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    line-height: 1.5;
  }
  .title p {
    margin: 0;
  }

  .wheel-outer {
    position: relative;
    width: 280px;
    height: 280px;
  }

  .pointer {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 28px;
    z-index: 2;
  }

  .wheel {
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 4px solid var(--text-color);
    background: conic-gradient(
      var(--sector-1) 0deg 90deg,
      var(--sector-2) 90deg 180deg,
      var(--sector-3) 180deg 270deg,
      var(--sector-4) 270deg 360deg
    );
    position: relative;
    transform: rotate(0deg);
    transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
  }

  .label {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100px;
    margin-left: -50px;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    transform: translate(0, -50%) rotate(var(--angle)) translateY(-95px) rotate(calc(-1 * var(--angle)));
  }

  .result-photo {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    opacity: 0;
    transform: scale(0.5);
    transition: opacity 0.5s ease, transform 0.5s ease;
    pointer-events: none;
    z-index: 3;
  }
  .result-photo.show {
    opacity: 1;
    transform: scale(1);
  }

  .spin-btn {
    margin-top: -10px;
    padding: 14px 32px;
    font-size: 18px;
    border: none;
    border-radius: 999px;
    background: #ff5c8a;
    color: #fff;
    cursor: pointer;
  }
  .spin-btn:disabled {
    opacity: 0.6;
    cursor: default;
  }

</style>
</head>
<body>
  <div class="content">
    <div class="title">
      <p>이정훈의 생일파티에 초대합니다.</p>
      <p>룰렛의 결과에 따라 일정이 결정됩니다!</p>
    </div>

    <div class="wheel-outer">
      <div class="pointer">▼</div>
      <div class="wheel" id="wheel">
        <span class="label" style="--angle:45deg">페이커와 협곡</span>
        <span class="label" style="--angle:135deg">엔믹스 콘서트</span>
        <span class="label" style="--angle:225deg">프미나 팬싸인회</span>
        <span class="label" style="--angle:315deg">다은이와 데이트</span>
      </div>
      <img class="result-photo" id="resultPhoto" src="images/Page2Result.jpeg" alt="">
    </div>

    <button class="spin-btn" id="spinBtn">룰렛 돌리기</button>
  </div>

  <button class="next-btn" id="nextBtn">다음으로</button>

  <audio id="bgMusic" src="mp3/룰렛.mp3" loop></audio>

  <script>
    const wheel = document.getElementById('wheel');
    const spinBtn = document.getElementById('spinBtn');
    const title = document.querySelector('.title');
    const resultPhoto = document.getElementById('resultPhoto');
    const nextBtn = document.getElementById('nextBtn');
    const bgMusic = document.getElementById('bgMusic');

    const bgTrack = bgMusic.getAttribute('src');

    (function resumeBgMusic() {
      const savedTrack = sessionStorage.getItem('bgMusicTrack');
      const savedTime = parseFloat(sessionStorage.getItem('bgMusicTime') || '0');
      const savedTimestamp = parseFloat(sessionStorage.getItem('bgMusicTimestamp') || '0');
      if (savedTrack !== bgTrack || !savedTimestamp) return;

      const applyTime = () => {
        let t = savedTime + (Date.now() - savedTimestamp) / 1000;
        if (bgMusic.duration && isFinite(bgMusic.duration)) {
          t = t % bgMusic.duration;
        }
        bgMusic.currentTime = t;
      };
      if (bgMusic.readyState >= 1) {
        applyTime();
      } else {
        bgMusic.addEventListener('loadedmetadata', applyTime, { once: true });
      }
    })();

    function tryPlayBgMusic() {
      bgMusic.play().catch(() => {});
    }
    tryPlayBgMusic();
    document.addEventListener('click', tryPlayBgMusic, { once: true });
    document.addEventListener('touchstart', tryPlayBgMusic, { once: true });

    window.addEventListener('pagehide', () => {
      sessionStorage.setItem('bgMusicTrack', bgTrack);
      sessionStorage.setItem('bgMusicTime', bgMusic.currentTime);
      sessionStorage.setItem('bgMusicTimestamp', Date.now());
    });

    document.querySelectorAll('button').forEach((btn) => {
      btn.addEventListener('click', () => {
        new Audio('mp3/버튼.mp3').play().catch(() => {});
      });
    });

    nextBtn.addEventListener('click', () => {
      setTimeout(() => {
        window.location.href = 'page3.html';
      }, 150);
    });

    let currentRotation = 0;

    spinBtn.addEventListener('click', () => {
      spinBtn.disabled = true;
      resultPhoto.classList.remove('show');

      // 4번 항목(270~360도 구간) 중심이 45도이므로,
      // 최종 회전각을 mod 360 기준 35~55도 사이로 맞추면 항상 4번에서 멈춘다.
      const targetMod = 45 + (Math.random() * 20 - 10);
      const currentMod = ((currentRotation % 360) + 360) % 360;
      let delta = targetMod - currentMod;
      delta = ((delta % 360) + 360) % 360;

      const fullSpins = 5 * 360;
      currentRotation += fullSpins + delta;
      wheel.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        title.innerHTML = '<p>축하합니다! 🎉</p><p>최고미녀 다은님과의 데이트가 성사되셨습니다.</p>';
        spinBtn.disabled = false;

        setTimeout(() => {
          resultPhoto.classList.add('show');
          new Audio('mp3/당첨.mp3').play().catch(() => {});
        }, 2000);
      }, 4000);
    });
  </script>
</body>
</html>
