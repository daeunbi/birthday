<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생일초대장 - 5</title>
<style>
  /* ====== 여기부터 디자인 커스텀 영역 (자유롭게 수정하세요) ====== */
  :root {
    --bg-color: #fff;
    --font-family: sans-serif;
    --text-color: #222;
    --bg-image: url('images/5.png');
  }
  /* ====== 여기까지 ====== */

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    position: relative;
    min-height: 100vh;
    background-color: var(--bg-color);
    background-image: var(--bg-image);
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    font-family: var(--font-family);
    color: var(--text-color);
  }

  .check-btn {
    position: absolute;
    width: 34px;
    height: 34px;
    transform: translate(-50%, -50%);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .check-btn svg {
    width: 28px;
    height: 28px;
    opacity: 0;
    transform: scale(0.3);
    transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .check-btn.checked svg {
    opacity: 1;
    transform: scale(1);
  }
  .check-btn:disabled {
    cursor: default;
  }

  .row-mask {
    position: absolute;
    left: 15%;
    width: 68%;
    height: 7.6%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 10px;
    transition: opacity 0.5s ease;
    pointer-events: none;
  }
  .row-mask.revealed {
    opacity: 0;
  }

  .next-btn {
    position: absolute;
    left: 78.8%;
    top: 81.8%;
    transform: translate(-50%, -50%) scale(0.7);
    background: none;
    border: none;
    font-size: 16px;
    font-weight: bold;
    color: #333;
    cursor: pointer;
    padding: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .next-btn.show {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
  }
</style>
</head>
<body>
  <button class="check-btn" style="left:17.1%; top:34.3%;"><svg viewBox="0 0 24 24"><path d="M7 7 L12 12 L21 3" stroke="#e02020" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></button>
  <button class="check-btn" style="left:17.1%; top:42.3%;"><svg viewBox="0 0 24 24"><path d="M7 7 L12 12 L21 3" stroke="#e02020" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></button>
  <button class="check-btn" style="left:17.1%; top:50.4%;"><svg viewBox="0 0 24 24"><path d="M7 7 L12 12 L21 3" stroke="#e02020" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></button>
  <button class="check-btn" style="left:17.1%; top:58.5%;"><svg viewBox="0 0 24 24"><path d="M7 7 L12 12 L21 3" stroke="#e02020" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></button>
  <button class="check-btn" style="left:17.1%; top:66.5%;"><svg viewBox="0 0 24 24"><path d="M7 7 L12 12 L21 3" stroke="#e02020" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></button>

  <div class="row-mask" style="top:42.3%;"></div>
  <div class="row-mask" style="top:50.4%;"></div>
  <div class="row-mask" style="top:58.5%;"></div>
  <div class="row-mask" style="top:66.5%;"></div>

  <button class="next-btn" id="nextBtn">다음으로</button>

  <audio id="bgMusic" src="mp3/일정.mp3" loop></audio>

  <script>
    const checkBtns = Array.from(document.querySelectorAll('.check-btn'));
    const masks = Array.from(document.querySelectorAll('.row-mask'));
    const nextBtn = document.getElementById('nextBtn');
    const bgMusic = document.getElementById('bgMusic');

    const bgTrack = bgMusic.getAttribute('src');

    (function resumeBgMusic() {
      const savedTrack = sessionStorage.getItem('bgMusicTrack');
      const savedTime = parseFloat(sessionStorage.getItem('bgMusicTime') || '0');
      const savedTimestamp = parseFloat(sessionStorage.getItem('bgMusicTimestamp') || '0');
      if (savedTrack !== bgTrack || !savedTimestamp) return;

      const applyTime = () => {
        let t = savedTime + (Date.now() - savedTimestamp) / 1000;
        if (bgMusic.duration && isFinite(bgMusic.duration)) {
          t = t % bgMusic.duration;
        }
        bgMusic.currentTime = t;
      };
      if (bgMusic.readyState >= 1) {
        applyTime();
      } else {
        bgMusic.addEventListener('loadedmetadata', applyTime, { once: true });
      }
    })();

    function tryPlayBgMusic() {
      bgMusic.play().catch(() => {});
    }
    tryPlayBgMusic();
    document.addEventListener('click', tryPlayBgMusic, { once: true });
    document.addEventListener('touchstart', tryPlayBgMusic, { once: true });

    window.addEventListener('pagehide', () => {
      sessionStorage.setItem('bgMusicTrack', bgTrack);
      sessionStorage.setItem('bgMusicTime', bgMusic.currentTime);
      sessionStorage.setItem('bgMusicTimestamp', Date.now());
    });

    document.querySelectorAll('button').forEach((btn) => {
      btn.addEventListener('click', () => {
        new Audio('mp3/버튼.mp3').play().catch(() => {});
      });
    });

    checkBtns.forEach((btn, i) => {
      if (i > 0) btn.disabled = true;

      btn.addEventListener('click', () => {
        if (btn.disabled || btn.classList.contains('checked')) return;
        btn.classList.add('checked');
        btn.disabled = true;

        if (masks[i]) {
          masks[i].classList.add('revealed');
        }
        if (i + 1 < checkBtns.length) {
          checkBtns[i + 1].disabled = false;
        } else {
          nextBtn.classList.add('show');
        }
      });
    });

    nextBtn.addEventListener('click', () => {
      setTimeout(() => {
        window.location.href = 'page6.html';
      }, 150);
    });
  </script>
</body>
</html>
